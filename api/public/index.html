blicos.",e:"📖",img:ie.aula},{t:"Investigación",d:"Investigación científica que conlleve apoyo a los Ministerios de la Iglesia y al Campo Misionero.",e:"🔬",img:ie.libros},{t:"Proyección Ministerial",d:"Proyección Ministerial al servicio del Señor.",e:"🙌",img:ie.iglesia},{t:"Producción de Obreros",d:"Producción de Obreros y Misioneros para la Obra del Señor.",e:"🌱",img:ie.estudiantes}],Rx=[{t:"Un solo Dios Trino",d:"Creemos en un solo Dios (Dt 6:4), infinito (Sal 147:5), inmutable (He 7:24), perfecto (Mt 5:48), Creador (1 P 4:19) y Sustentador (He 1:3) de todas las cosas; de eterna existencia (Gn 21:33) en las tres personas de la Santísima Trinidad: Padre, Hijo y Espíritu Santo (Mt 28:19)."},{t:"Jesucristo, Dios y Hombre",d:"Creemos que Jesucristo es verdadero Dios (2 P 1:4) y verdadero Hombre (Mt 8:20), nacido de la Virgen María por obra del Espíritu Santo (Mt 1:18-22); vivió sin pecado (He 4:15), murió en la cruz en sacrificio sustituto (Ro 3:25), fue sepultado, resucitó al tercer día y ascendió corporalmente (Hch 1:9). Hoy está a la diestra de Dios como nuestro representante (Ro 8:34) y único mediador (1 Ti 2:5); vendrá otra vez a establecer su Reino de Justicia y Paz (Hch 1:11). Es el Salvador de todos los que se arrepienten y creen en su obra expiatoria (Jn 3:16)."},{t:"Espíritu Santo",d:"Creemos que el Espíritu Santo es la tercera persona de la Trinidad (2 Co 13:14), que habita en la Iglesia desde Pentecostés (Hch 2:1-4 / Jn 14:16-17). Convence al mundo de pecado, justicia y juicio (Jn 16:8), da vida nueva al que cree en Cristo (Ro 6:1-4), regenera, confirma que somos hijos de Dios y bautiza al creyente, normalmente en experiencia subsiguiente a la conversión (1 Co 3:16)."},{t:"Sanidad Divina",d:"Creemos en la sanidad divina por medio de la oración en Jesucristo (Mr 16:18)."},{t:"Las Escrituras",d:"Creemos en las Sagradas Escrituras: 66 libros del Antiguo y Nuevo Testamento, sobrenatural, plenaria y dinámicamente inspiradas por Dios (2 Ti 3:16)."},{t:"El Hombre",d:"Creemos que el hombre, creado a imagen y semejanza de Dios (Gn 1:26), cayó por desobediencia (Ro 5:19), trayendo muerte física y espiritual sobre la humanidad (Ro 5:12). Nace con naturaleza pecaminosa y separado de Dios (Ro 3:23)."},{t:"Destino Eterno",d:"Creemos que el destino del impenitente e incrédulo es existencia en tormento, mientras que el del creyente en Jesucristo es existencia en espíritu, alma y cuerpo glorificado, de eterno gozo y comunión con el Señor (Jn 3:18-21)."},{t:"La Iglesia",d:"Creemos que la Iglesia Universal, verdadero cuerpo místico de Cristo (1 Co 12:12-27), está constituida por todas las personas renacidas por el Espíritu Santo sobre la base de la fe en Jesucristo (Ro 9:25-26; 1 Co 1:2)."},{t:"Segunda Venida",d:"Creemos que Jesucristo vendrá corporalmente por segunda vez para establecer su reino (Mt 16:27). Su venida será inminente (Ap 3:11 / Mt 24:36) y pre-milenial (Ap 20)."}],Fx=[{n:"Jonatan Q.",p:"PER",img:ee[0],rol:"Director · Teología",q:"Formar ministros fieles es mi llamado: te enseño para que enseñes."},{n:"David R.",p:"USA",img:ee[1],rol:"Misiones Transculturales",q:"El campo me enseñó más que los libros; ahora te toca a ti vivirlo."},{n:"Wilber Q.",p:"PER",img:ee[2],rol:"Docente Biblia",q:"La Palabra es práctica: la estudiamos y la obedecemos juntos."},{n:"Sophia Ann A.",p:"USA",img:ee[3],rol:"Capellanía · Cuidado",q:"Cuidamos tu corazón mientras Dios afirma tu llamado."},{n:"David Q.",p:"PER",img:ee[4],rol:"Bi-vocacional · Carpintería",q:"Con tus manos también se predica: oficio y ministerio van juntos."},{n:"Juana B.",p:"ARG",img:ee[5],rol:"Docente Ministerios",q:"Servir con alegría se entrena: aquí lo practicamos cada semana."},{n:"Samuel Q.",p:"PER",img:ee[6],rol:"Evangelismo · Campo",q:"Salimos a las calles y comunidades: la teoría se vuelve misión."},{n:"Abigail R.",p:"USA",img:ee[0],rol:"Adoración · Alabanza",q:"Adoramos antes de salir: un misionero lleno del Espíritu."},{n:"Enoc Q.",p:"PER",img:ee[1],rol:"Logística BCB",q:"Todo viaje misionero empieza con orden y oración."},{n:"Alejandro C.",p:"REP DOM",img:ee[2],rol:"Plantación de Iglesias",q:"Del Caribe a Cusco: levantar iglesias que envían."},{n:"Shiomara C.",p:"PER",img:ee[3],rol:"Educación Cristiana",q:"Enseñar a otros a enseñar: así se multiplica la obra."},{n:"Ruben C.",p:"PER",img:ee[4],rol:"Bi-vocacional · Gastronomía",q:"Cocinar también es servir: excelencia para la gloria de Dios."},{n:"Elías Q.",p:"PER",img:ee[5],rol:"Jóvenes · Movilización",q:"Tu generación es enviada: descubre tu ruta en el BCB."}],$u=[{t:"Mobilization & Sending",d:"Mobilization, training, equipping, sending, and care of workers, leaders, ministers, and churches contributing to the spread of the Gospel.",e:"🌍",img:ie.mision},{t:"Academic Formation",d:"Academic formation of Christians, workers, missionaries, and pastors in Biblical principles.",e:"📖",img:ie.aula},{t:"Research",d:"Scientific research supporting church ministries and the mission field.",e:"🔬",img:ie.libros},{t:"Ministerial Outreach",d:"Ministerial outreach in service to the Lord.",e:"🙌",img:ie.iglesia},{t:"Raising Workers",d:"Raising workers and missionaries for the Lord’s work.",e:"🌱",img:ie.estudiantes}],Ou=[{t:"One Triune God",d:"We believe in one God (Dt 6:4), infinite (Ps 147:5), unchangeable (Heb 7:24), perfect (Mt 5:48), Creator (1 Pt 4:19) and Sustainer (Heb 1:3) of all things; eternally existing (Gn 21:33) in the three persons of the Holy Trinity: Father, Son, and Holy Spirit (Mt 28:19)."},{t:"Jesus Christ, God and Man",d:"We believe Jesus Christ is true God (2 Pt 1:4) and true Man (Mt 8:20), born of the Virgin Mary by the Holy Spirit (Mt 1:18-22); He lived without sin (Heb 4:15), died on the cross as a substitute sacrifice (Rom 3:25), was buried, rose on the third day, and ascended bodily (Acts 1:9). Today He is at God’s right hand as our representative (Rom 8:34) and only mediator (1 Tim 2:5); He will come again to establish His Kingdom of Justice and Peace (Acts 1:11). He is the Savior of all who repent and believe in His atoning work (Jn 3:16)."},{t:"Holy Spirit",d:"We believe the Holy Spirit is the third person of the Trinity (2 Cor 13:14), dwelling in the Church since Pentecost (Acts 2:1-4 / Jn 14:16-17). He convicts the world of sin, righteousness, and judgment (Jn 16:8), gives new life to whoever believes in Christ (Rom 6:1-4), regenerates, confirms we are God’s children, and baptizes the believer, normally in an experience after conversion (1 Cor 3:16)."},{t:"Divine Healing",d:"We believe in divine healing through prayer in Jesus Christ (Mk 16:18)."},{t:"The Scriptures",d:"We believe in the Holy Scriptures: the 66 books of the Old and New Testaments, supernaturally, fully, and dynamically inspired by God (2 Tim 3:16)."},{t:"Mankind",d:"We believe man, created in God’s image and likeness (Gn 1:26), fell through disobedience (Rom 5:19), bringing physical and spiritual death upon humanity (Rom 5:12). He is born with a sinful nature, separated from God (Rom 3:23)."},{t:"Eternal Destiny",d:"We believe the destiny of the unrepentant unbeliever is existence in torment, while the believer in Jesus Christ will exist in glorified spirit, soul, and body, in eternal joy and communion with the Lord (Jn 3:18-21)."},{t:"The Church",d:"We believe the Universal Church, the true mystical body of Christ (1 Cor 12:12-27), is made up of all people reborn by the Holy Spirit on the basis of faith in Jesus Christ (Rom 9:25-26; 1 Cor 1:2)."},{t:"Second Coming",d:"We believe Jesus Christ will come bodily a second time to establish His Kingdom (Mt 16:27). His coming will be imminent (Rev 3:11 / Mt 24:36) and pre-millennial (Rev 20)."}],Du=[{n:"Jonatan Q.",p:"PER",img:ee[0],rol:"Director · Theology",q:"Forming faithful ministers is my calling: I teach you so you can teach."},{n:"David R.",p:"USA",img:ee[1],rol:"Transcultural Missions",q:"The field taught me more than books; now it’s your turn to live it."},{n:"Wilber Q.",p:"PER",img:ee[2],rol:"Bible Teac Basado en la investigación del Dr. Mark A. Gabriel quien se formó y enseñó en el corazón académico de El Cairo antes de conocer a Cristo.`,p:30,mod:"Virtual",nivel:"Avanzado",semanas:4,lecciones:2,rating:4.9,est:10,tag:"Avanzado",img:"assets/portal/jesus-y-mahoma.jpg",temario:["Lección 1:","Lección 2"]},{id:2,slug:"alcanzando-al-mundo-musulman",n:"Alcanzando al mundo musulmán",a:"Ministerio",d:"Formación bíblica, teológica y misionera al ritmo de tu vida.",p:30,mod:"Virtual",nivel:"Avanzado",semanas:4,lecciones:8,rating:4.9,est:13,tag:"Avanzado",img:"assets/portal/alcanzando-al-mundo-musulman.jpg",temario:["Lección 1: Jesús es por los musulmanes","Lección 2: Construyendo puentes","3","Lección 3","Lección 4","Leccion 5","Leccion 6","Los Musulmanes y la Biblia"]},{id:3,slug:"mateo-discipulado-fe-y-obediencia",n:"MATEO, Discipulado, Fe y Obediencia",a:"Biblia",d:"Formación bíblica, teológica y misionera al ritmo de tu vida.",p:30,mod:"Virtual",nivel:"Fundamentos",semanas:4,lecciones:12,rating:4.9,est:14,tag:"Portal",img:"assets/portal/mateo-discipulado-fe-y-obediencia.jpg",temario:["Lección 1: Introducción a Mateo y la genealogía de Jesús","Lección 2","Lección 3","Islam Popular","6- Islam Popular","Lección 4","Leccion 5","Lección 6","Lección 7","Lección 8","Lección 9","LECCION 10"]},{id:4,slug:"angeologia-un-estudio-de-teologia-sistematica",n:"ANGEOLOGÍA, Un estudio de Teología Sistemática",a:"Ministerio",d:`La Angeología es la rama de la Teología Sistemática que estudia la naturaleza, origen, atributos, ministerio, organización y actividad de los seres angelicales según la revelación bíblica. Este curso avanzado ofrece un análisis exhaustivo y académico de la doctrina de los ángeles dentro del marco de la teología cristiana histórica, evangélica y bíblica.
A través de un enfoque exegético, teológico e histórico, el estudiante examinará la enseñanza de las Escrituras acerca de los ángeles santos, los ángeles caídos, Satanás y los demonios, evaluando las principales interpretaciones desarrolladas a lo largo de la historia de la Iglesia. Asimismo, se analizará la participación de los seres angelicales en el plan redentor de Dios, su relación con la humanidad y su función en los acontecimientos escatológicos.
El curso busca proporcionar una comprensión sólida, equilibrada y bíblicamente fundamentada de la doctrina angelológica, capacitando al estudiante para discernir críticamente las diversas corrientes teológicas contemporáneas, así como los conceptos populares que frecuentemente distorsionan la enseñanza bíblica sobre el mundo espiritual.
El estudio integrará herramientas de investigación teológica, análisis textual de los idiomas bíblicos cuando sea pertinente, evaluación de fuentes históricas y reflexión ministerial, permitiendo al estudiante desarrollar una perspectiva integral sobre la naturaleza y actividad de los seres espirituales dentro de la cosmovisión cristiana.`,p:30,mod:"Virtual",nivel:"Intermedio",semanas:4,lecciones:7,rating:4.9,est:11,tag:"Intermedio",img:"assets/portal/angeologia-un-estudio-de-teologia-sistematica.jpg",temario:["Lección 1: Una introducción a al Angeología","Lección 2: Los ángeles, su naturaleza y características","Lección 3: los ángeles, su organización","Lección 4: Los ángeles, su ministerio","Lección 5: La prueba de los ángeles: triunfo y tragedia","Lección 6","Lección 7"]},{id:5,slug:"amos-analisis-y-teologia-progresiva",n:"AMÓS, Análisis y Teología Progresiva",a:"Biblia",d:`El presente curso ofrece un estudio avanzado, exegético, histórico-teológico y hermenéutico del libro de Libro de Amós, considerado una de las obras proféticas más influyentes del corpus profético del Antiguo Testamento. El programa examina críticamente el mensaje de Amós dentro de su contexto histórico, político, económico, social y religioso del antiguo Israel del siglo VIII a.C., durante los reinados de Jeroboam II en Israel y Uzías en Judá.

El curso está diseñado para estudiantes de nivel universitario, seminario teológico, formación ministerial avanzada e investigadores bíblicos que deseen profundizar en la literatura profética desde una perspectiva académica interdisciplinaria. Se integrarán enfoques de exégesis hebrea, crítica literaria, crítica histórica, teología bíblica, análisis socio-retórico y hermenéutica contemporánea.

A lo largo del curso se estudiarán las principales estructuras literarias del libro, los oráculos contra las naciones, las denuncias sociales, la teología del pacto, la justicia divina, el juicio escatológico y la esperanza restauradora presente en los capítulos finales. Asimismo, se evaluará la relevancia contemporánea del mensaje de Amós en relación con la ética social, la corrupción religiosa, la pobreza estructural y la responsabilidad profética de la Iglesia y la sociedad.

El curso fomentará la investigación académica rigurosa, la lectura crítica de textos bíblicos en diálogo con fuentes antiguas y modernas, y la aplicación teológica contextualizada para el pensamiento cristiano contemporáneo.`,p:30,mod:"Virtual",nivel:"Avanzado",semanas:4,lecciones:5,rating:4.9,est:1,tag:"Avanzado",img:"assets/portal/amos-analisis-y-teologia-progresiva.jpg",temario:["Intro","Nueva lección","asda","Nueva lección","Nueva lección"]},{id:6,slug:"antropologia-y-hamartiologia-biblica",n:"Antropología y Hamartiología Bíblica",a:"Teología",d:`ANTROPOLOGÍA Y HAMARTIOLOGÍA BÍBLICA, es un curso de Teología Sistemática.
Explora en profundidad la naturaleza del ser humano y la realidad del pecado desde una perspectiva bíblica sólida y rigurosa. Este curso te llevará a comprender quién es el hombre según Dios, su propósito, su condición caída y la necesidad de redención.
A través de un enfoque exhaustivo y analítico, estudiarás temas clave como la creación a imagen de Dios, la caída, la corrupción del corazón humano y las implicaciones del pecado en todas las áreas de la vida. Pero no se queda en la teoría: cada enseñanza está diseñada para aterrizar en lo práctico, ayudándote a evaluar tu vida, tomar decisiones con discernimiento y vivir con mayor coherencia espiritual.
Ideal para quienes desean profundizar en la teología sistemática con un enfoque claro, bíblico y aplicable.
¡Comprende tu condición! ¡Renueva tu perspectiva! ¡Vive con propósito!`,p:30,mod:"Virtual",nivel:"Intermedio",semanas:4,lecciones:12,rating:4.9,est:16,tag:"Intermedio",img:"assets/portal/antropologia-y-hamartiologia-biblica.jpg",temario:["Lección 1: El hombre, una introducción","Lección 2: El hombre: su origen","Lección 3: El hombre: hecho a imagen de Dios","Lección 4: La imagen de Dios en el hombre: implicaciones prácticas","Lección 5: Implicaciones prácticas de la imagen de Dios en el hombre II","Lección 6: El hombre: Su composición I","Lección 7: El hombre: Su composición II","Lección 8: El pecado: lo que la Biblia enseña - I","Lección 9: El pecado: Lo que la Biblia enseña - II","Lección 10: La Gran tragedia humana, Sus consecuencias I","Lección 11: La Gran tragedia humana, Sus consecuencias II","Lección 12: El hombre: su destino"]},{id:7,slug:"el-islam-introduccion-y-enfoque",n:"EL ISLAM, Introducción y enfoque",a:"Ministerio",d:"Este curso, es un estudio introductorio del Islam, incluye sus creencias, prácticas y su estado actual como religión mundial. Ofrece directrices prácticas para el testimonio cristiano efectivo a los musulmanes. Se da especial énfasis a la oración intercesora y a la función del Espíritu Santo en el proceso de conversión y discipulado",p:30,mod:"Virtual",nivel:"Avanzado",semanas:4,lecciones:10,rating:4.9,est:13,tag:"Avanzado",img:"assets/portal/el-islam-introduccion-y-enfoque.jpg",temario:["Lección 1: Mahoma","Lección 2: El Corán","Lección 3: Clave uno: Avances y poder-del desierto al centro de atención","Lección 4: Clave dos: el Islam de dentro hacia afuera","Lección 5: Clave tres: La faz cambiante del Islam","Lección 6: Clave cuatro: Religión popular- el pueblo del Islam","Leccion 7","Leccion","Lección","Nueva lección"]},{id:8,slug:"corintios-analisis-y-teologia-progresiva-en-las-epistolas",n:"CORINTIOS, Análisis y Teología Progresiva en las Epístolas",a:"Biblia",d:`EPÍSTOLAS DE PABLO A LOS CORINTIOS
Descubre la riqueza espiritual y práctica de 1° y 2° de Corintios, en un curso diseñado para transformar tu manera de pensar y vivir la fe.
El curso nos introduce a una iglesia llena de desafíos reales: divisiones, inmadurez espiritual, conflictos morales y dudas doctrinales. A través de un análisis profundo, aprenderás cómo Pablo responde con sabiduría y firmeza, enseñando sobre la unidad, el amor, los dones espirituales y el verdadero significado de seguir a Cristo en medio de una sociedad compleja.
Las cartas son intensas y con carga personal del apóstol que nos enseñan a vivir con integridad, aun en medio de la debilidad.
Este curso no solo es teológico y analítico, sino también profundamente práctico.`,p:30,mod:"Virtual",nivel:"Avanzado",semanas:6,lecciones:13,rating:4.9,est:17,tag:"Avanzado",img:"assets/portal/corintios-analisis-y-teologia-progresiva-en-las-epistolas.jpg",temario:["Lección 1: La ciudad y la iglesia","Lección 2: La Iglesia y las cartas","Lección 3: La sabiduría de Dios y la conducta cristiana","Lección 4: El fundamento de la conducta cristiana I","Lección 5: El fundamento de la conducta cristiana II","Lección 6: Abusos de la libertad cristiana I","Lección 7: Abusos de la libertad cristiana II","Lección 8: La libertad cristiana y las disputas","Lección 9: Libertad y Moralidad Cristianas","Lección 10 : Los límites de la libertad cristiana - I","Lección 11: Los límites de la libertad cristiana - II","Lección : Los dones espirituales en la adoración cristiana","Lección : La resurrección y el servicio cristiano"]},{id:9,slug:"analisis-a-la-musica-eclesiastica",n:"Análisis a la Música Eclesiástica",a:"Ministerio",d:"El curso de ANÁLISIS A LA MÚSICA ECLESIASTICA, no es un curso de teoría musical o historia de la música. Es un curso de reflexión y análisis bíblico, teológico, pedagógico y psicológico, a cerca de la música que escuchas o ejecutas, en tu vida personal y ministerial. Se hace énfasis no solo en el texto, sino en todo el mensaje y contenido que se transmite a través de la música. Es un curso que puede ayudar a todo creyente y músico en su devoción y servicio de adoración a Dios.",p:30,mod:"Virtual",nivel:"Intermedio",semanas:4,lecciones:11,rating:4.9,est:17,tag:"Intermedio",img:"assets/portal/analisis-a-la-musica-eclesiastica.jpg",temario:["Lección 1: La Música es comunicación","Lección 2: La Música: secular, religiosa y cristiana","Lección 3: La música, comunicación inspirada","Lección 4: Cómo nos llegó la música a la Iglesia","Lección 5: La música cristiana: medio de koinonía y gratitud","Lección 6: El objetivo de la música cristiana: un camino a la comunión c
